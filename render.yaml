services:
  - type: web
    name: lead-backend
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd api && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RENDER
        value: "true"
      - key: NODE_VERSION
        value: "18"
