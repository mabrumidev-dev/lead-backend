services:
  - type: web
    name: lead-backend-rezr
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
      - key: RENDER
        value: "true"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: MIMO_API_KEY
        sync: false
      - key: PORT
        value: "10000"
