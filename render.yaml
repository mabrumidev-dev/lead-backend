services:
  - type: web
    name: lead-backend
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "18"
      - key: RENDER
        value: "true"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
