services:
  - type: web
    name: lead-backend
    runtime: python
    plan: free
    buildCommand: |
      python -m venv .venv
      . .venv/bin/activate
      pip install -r requirements.txt
      npm install
      npm run build
    startCommand: |
      . .venv/bin/activate
      cd api && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "18"
      - key: RENDER
        value: "true"
